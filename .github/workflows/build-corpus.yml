name: Build validated corpus

on:
  push:
    paths:
      - 'analysis/build_full_corpus_master.py'
      - 'analysis/build_full_corpus_master_v2.py'
      - 'analysis/build_full_corpus_master_v3.py'
      - 'analysis/build_full_corpus_master_v4.py'
      - 'analysis/build_full_corpus_master_v5.py'
      - 'analysis/build_full_corpus_master_v6.py'
      - 'data/processed/ai_coding_pilot_batch_*.csv'
      - 'data/processed/pilot_schema_supplement_v1.csv'
      - 'data/processed/full_corpus_coding_batch_*.csv'
      - 'data/processed/recurring_series_map_v1.csv'
      - '.github/workflows/build-corpus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas
      - name: Build and validate master corpus
        run: python analysis/build_full_corpus_master_v6.py
      - name: Commit generated master and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/full_corpus_coded_master_v1.csv analysis/reproducibility_report_v1.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build validated full corpus master"
            git push
          fi
