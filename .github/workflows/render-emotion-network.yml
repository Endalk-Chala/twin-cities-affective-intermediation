name: Render emotion network

on:
  push:
    paths:
      - 'analysis/render_emotion_network_v1.py'
      - 'data/processed/full_corpus_coded_master_v1.csv'
      - '.github/workflows/render-emotion-network.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas networkx matplotlib
      - run: python analysis/render_emotion_network_v1.py
      - name: Commit generated emotion network outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/generated/emotion_network_v1
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Render full-corpus emotion network outputs'
            git push
          fi
