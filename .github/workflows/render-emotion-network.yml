name: Render affective networks

on:
  push:
    paths:
      - 'analysis/render_emotion_network_v1.py'
      - 'analysis/render_affective_circulation_network_v3.py'
      - 'analysis/render_affective_circulation_network_r_v1.R'
      - 'data/processed/full_corpus_coded_master_v1.csv'
      - 'data/raw/news_media_uptake_batch_*.csv'
      - 'data/interim/media_multi_org_split_corrections_v1.csv'
      - 'data/processed/media_frame_transformation_audit_v1.csv'
      - '.github/workflows/render-emotion-network.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas networkx matplotlib
      - run: python analysis/render_emotion_network_v1.py
      - run: python analysis/render_affective_circulation_network_v3.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install GLPK runtime
        run: sudo apt-get update && sudo apt-get install -y libglpk40
      - name: Install R network packages from Posit Package Manager
        run: Rscript -e 'install.packages(c("readr","dplyr","tibble","igraph","tidygraph","ggraph","graphlayouts","ggplot2","scales"), repos="https://packagemanager.posit.co/cran/__linux__/noble/latest")'
      - name: Render R force-directed network
        run: Rscript analysis/render_affective_circulation_network_r_v1.R
      - name: Upload rendered affective network outputs
        uses: actions/upload-artifact@v4
        with:
          name: affective-network-outputs-v1
          path: |
            analysis/generated/emotion_network_v1
            analysis/generated/affective_circulation_network_v1
      - name: Commit generated network outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/generated/emotion_network_v1 analysis/generated/affective_circulation_network_v1
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Render full affective network outputs including R force layout'
            git push
          fi
